  <dialog id="taskModal"><form id="taskForm"><div class="modal-heading"><span class="eyebrow">NEW PRODUCT TASK</span><button type="button" class="icon-button" id="closeModal" aria-label="关闭">×</button></div><h2>创建产品任务</h2><p class="muted">先建立产品档案，再逐步推进选品、生图与上品。</p><label>产品名称 <input name="name" required maxlength="80" placeholder="例如：柠檬味电解质条包"></label><div class="form-row"><label>产品类目<select name="category"><option>运动营养</option><option>膳食补充剂</option></select></label><label>起始阶段<select name="stage"><option value="0">需求 / 征品</option><option value="1">选品评估</option><option value="2">资料确认</option><option value="3">视觉生图</option><option value="4">上品准备</option></select></label></div><label>负责人<select name="owner"><option>我</option><option>运营 A（演示）</option><option>设计 B（演示）</option></select></label><label>任务备注<textarea name="note" maxlength="500" placeholder="填写目标市场、参考链接或需要解决的问题"></textarea></label><div class="form-note">此任务仅保存在当前浏览器，团队数据将在后续模块接入。</div><div class="modal-footer"><button type="button" class="button" id="cancelModal">取消</button><button type="submit" class="button primary">创建演示任务 <span>↗</span></button></div></form></dialog>
